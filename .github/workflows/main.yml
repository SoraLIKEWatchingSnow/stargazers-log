name: Update Starred Repos

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨 0 点自动执行一次
  workflow_dispatch:    # 允许你手动点击按钮执行

# 核心修复：给这个机器人赋予写入文件的最高权限
permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Starred Repos
        uses: actions/github-script@v7
        with:
          # 这里通过 secrets.GH_PAT 引用你刚才在设置里配置的保险箱
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const fs = require('fs');
            // 获取你所有的 star 列表，最多获取 1000 个
            let stars = await github.paginate(github.rest.activity.listReposStarredByAuthenticatedUser, { per_page: 100 });
            
            let md = "# 🌟 我的标星日志 (Starred Repos)\n\n";
            md += `最后更新时间: ${new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })}\n\n`;
            
            stars.forEach(repo => {
              md += `- [${repo.full_name}](${repo.html_url}) : ${repo.description || '无描述'}\n`;
            });
            
            fs.writeFileSync('README.md', md);

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add README.md
          # 如果没有文件变更就跳过
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: auto-update starred logs"
          # 拉取最新代码防止冲突，然后推送
          git pull --rebase origin main || true
          git push
