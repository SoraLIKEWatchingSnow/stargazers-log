name: Update Starred Repos

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨 0 点自动执行一次
  workflow_dispatch:    # 允许你手动点击按钮执行

jobs:
  update-stars:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Starred Repos
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            // 获取你所有的 star 列表，最多获取 1000 个
            let stars = await github.paginate(github.rest.activity.listReposStarredByAuthenticatedUser, { per_page: 100 });
            
            let md = "# 🌟 我的标星日志 (Starred Repos)\n\n";
            md += `最后更新时间: ${new Date().toLocaleString()}\n\n`;
            
            stars.forEach(repo => {
              md += `- [${repo.full_name}](${repo.html_url}) : ${repo.description || '无描述'}\n`;
            });
            
            fs.writeFileSync('README.md', md);

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add README.md
          git commit -m "docs: auto-update starred logs" || exit 0
          git push
