<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Stargazers Log</title>
    <style>
        /* 整个页面的基础样式：浅灰背景，居中排版 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        
        /* 标题样式 */
        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        /* 图片容器：限制最大宽度，防止图片太大撑爆屏幕 */
        .image-container {
            max-width: 500px;
            margin: 30px auto;
        }

        /* 图片样式：圆角、阴影，让图片看起来像一张卡片 */
        .image-container img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease; /* 鼠标悬停动画 */
        }

        /* 鼠标悬停在图片上时，稍微放大 */
        .image-container img:hover {
            transform: scale(1.03);
        }

        /* 底部描述文字 */
        p {
            font-size: 1.1em;
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* 按钮样式：点击跳转到你的 GitHub 仓库 */
        .github-btn {
            display: inline-block;
            background-color: #24292e;
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .github-btn:hover {
            background-color: #4a545e;
        }
    </style>
</head>
<body>

    <h1>🌟 我的标星日志</h1>
    <p>记录我在 GitHub 上收藏的宝藏项目。</p >

    <div class="image-container">
        <!-- 注意这里的 src，必须和图片名一模一样 -->
        < img src="violet.png" alt="Violet Evergarden">
    </div>

    <p>“我想知道， '我爱你' 是什么意思。”<br>——《紫罗兰永恒花园》</p >

    <!-- 加个按钮链接回你的仓库 -->
    <a href=" " class="github-btn" target="_blank">访问我的 GitHub 仓库</a >

</body>
</html>
